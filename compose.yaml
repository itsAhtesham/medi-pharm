name: medi-pharm
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: medi_pharm
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: medi_pharm
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medi_pharm -d medi_pharm']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: medi_pharm
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: medi_pharm_test
    ports:
      - '127.0.0.1:54330:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medi_pharm -d medi_pharm_test']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
